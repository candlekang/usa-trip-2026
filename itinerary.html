<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>一男大戰六女 美國行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15121C;
    --paper:#211C2C;
    --paper2:#2A2438;
    --ink:#F5F0E6;
    --ink-soft:#B0A8C2;
    --teal:#3FCBBA;
    --teal-tint: rgba(63,203,186,0.16);
    --cherry:#FF6A52;
    --cherry-tint: rgba(255,106,82,0.16);
    --mustard:#F7B84B;
    --mustard-tint: rgba(247,184,75,0.16);
    --pink:#FF8FAB;
    --pink-tint: rgba(255,143,171,0.16);
    --sage:#7FCB79;
    --sage-tint: rgba(127,203,121,0.16);
    --line: rgba(255,255,255,0.14);
    --shadow: rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;overflow-x:hidden;-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg);
    background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1.4px, transparent 1.4px);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Quicksand',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;touch-action:manipulation;}
  input,textarea{font-family:inherit;font-size:16px;}
  .app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;width:100%;
       padding-bottom:calc(88px + env(safe-area-inset-bottom));}

  /* ---------- Landing ---------- */
  #landing{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px;text-align:center;position:relative;
  }
  .route-doodle{width:100%;max-width:340px;margin:6px auto 18px;}
  .route-doodle path{stroke:var(--teal);stroke-width:2.5;stroke-dasharray:7 8;fill:none;stroke-linecap:round;}
  .landing-emoji-row{font-size:26px;margin-top:-14px;margin-bottom:6px;letter-spacing:14px;}
  #landing h1{font-size:32px;font-weight:800;margin:0 0 4px;color:var(--cherry);line-height:1.25;}
  #landing .sub{font-size:15px;color:var(--ink-soft);margin:0 0 26px;font-weight:600;}
  .tag-card{
    background:var(--paper);border-radius:18px;padding:22px 22px 26px;
    box-shadow:5px 5px 0 var(--shadow); border:2px dashed var(--mustard);
    width:100%;max-width:340px;
  }
  .tag-card label{display:block;font-weight:700;font-size:14px;margin-bottom:10px;color:var(--ink-soft);}
  .tag-card input{
    width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);
    font-size:16px;font-weight:600;text-align:center;background:var(--bg);color:var(--ink);
    outline:none;
  }
  .tag-card input:focus{border-color:var(--teal);}
  .go-btn{
    margin-top:18px;width:100%;padding:13px;border:none;border-radius:999px;
    background:var(--cherry);color:#1A1420;font-weight:700;font-size:16px;
    box-shadow:4px 4px 0 rgba(0,0,0,0.4);transition:transform .12s;
  }
  .go-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,0.4);}
  .go-btn:disabled{opacity:.4;}
  .landing-note{margin-top:16px;font-size:12px;color:var(--ink-soft);}

  /* ---------- Top bar ---------- */
  #topbar{
    position:sticky;top:0;z-index:20;background:var(--bg);
    padding:calc(14px + env(safe-area-inset-top)) 18px 10px;border-bottom:2px solid var(--line);
  }
  #topbar .row1{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  #topbar h2{font-size:15.5px;margin:0;font-weight:700;color:var(--ink);}
  .hi-chip{font-size:12px;font-weight:700;color:var(--teal);background:var(--teal-tint);padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .count-chip{font-size:12px;font-weight:700;color:var(--mustard);background:var(--mustard-tint);padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .progress-wrap{margin-top:10px;}
  .progress-label{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
  .progress-bar{height:9px;border-radius:999px;background:var(--line);overflow:hidden;}
  .progress-fill{height:100%;background:var(--teal);border-radius:999px;transition:width .4s;}

  /* ---------- Tabs ---------- */
  #tabbar{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    display:flex;justify-content:center;background:var(--paper);border-top:2px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #tabbar .inner{max-width:520px;width:100%;display:flex;}
  .tab-btn{
    flex:1;padding:9px 1px 7px;background:none;border:none;text-align:center;
    font-size:10px;font-weight:700;color:var(--ink-soft);min-width:0;
  }
  .tab-btn .ic{display:block;font-size:18px;margin-bottom:2px;}
  .tab-btn.active{color:var(--cherry);}

  .view{display:none;padding:14px 16px 10px;}
  .view.active{display:block;}

  /* ---------- Cards (day / region) ---------- */
  .exp-card{
    background:var(--paper);border-radius:18px;margin-bottom:14px;
    box-shadow:4px 4px 0 var(--shadow);border:2px solid rgba(255,255,255,0.08);overflow:hidden;
  }
  .exp-head{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;}
  .stamp{
    width:50px;height:50px;min-width:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:23px;border:2px dashed rgba(21,18,28,0.35);transform:rotate(-6deg);
  }
  .exp-head-info{flex:1;min-width:0;}
  .exp-head-info .dline1{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;word-break:break-word;}
  .exp-head-info .city-tag{font-size:11px;font-weight:700;color:var(--teal);background:var(--teal-tint);padding:2px 8px;border-radius:999px;}
  .exp-head-info .dline2{font-size:12px;color:var(--ink-soft);margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .chevron{font-size:14px;color:var(--ink-soft);transition:transform .25s;margin-left:4px;}
  .exp-card.open .chevron{transform:rotate(180deg);}
  .mini-progress{font-size:11px;font-weight:700;color:var(--ink-soft);}

  .exp-body{display:none;padding:2px 16px 18px;}
  .exp-card.open .exp-body{display:block;}
  .route-list{position:relative;padding-left:20px;margin-top:8px;}
  .route-list::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:0;border-left:2.5px dashed var(--line);}
  .item{position:relative;padding:10px 0 14px;border-bottom:1px dashed var(--line);}
  .item:last-child{border-bottom:none;}
  .item::before{content:'';position:absolute;left:-20px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--teal);border:2px solid var(--paper);box-shadow:0 0 0 2px var(--teal);}
  .item.done::before{background:var(--sage);box-shadow:0 0 0 2px var(--sage);}
  .item-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .time-chip{font-size:11px;font-weight:700;color:var(--mustard);background:var(--mustard-tint);padding:2px 8px;border-radius:999px;white-space:nowrap;}
  .item-title{font-weight:700;font-size:14.5px;word-break:break-word;}
  .item-note{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .badge{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;border:1.5px solid;}
  .badge.res{color:var(--cherry);border-color:var(--cherry);background:var(--cherry-tint);}
  .badge.fav{color:var(--pink);border-color:var(--pink);background:var(--pink-tint);}
  .map-links{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;}
  .map-link{font-size:11.5px;font-weight:700;color:var(--teal);background:var(--teal-tint);padding:3px 9px;border-radius:999px;text-decoration:none;display:inline-flex;align-items:center;gap:3px;}
  .map-link:active{background:var(--teal);color:#15121C;}

  .action-row{margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .member-pips{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .pip{
    width:22px;height:22px;min-width:22px;border-radius:50%;border:1.5px solid var(--line);
    display:inline-flex;align-items:center;justify-content:center;background:transparent;position:relative;
    font-size:10px;font-weight:800;color:var(--ink-soft);
  }
  .pip.checked{background:var(--sage);border-color:var(--sage);color:#15121C;}
  .pip.self{border-color:var(--teal);}
  .pip.self input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
  .pip.self .mark{pointer-events:none;}
  .comment-toggle{font-size:11.5px;font-weight:700;color:var(--ink-soft);background:none;border:1.5px solid var(--line);padding:4px 10px;border-radius:999px;}
  .comment-toggle.hasnew{color:var(--pink);border-color:var(--pink);}
  .comment-panel{display:none;margin-top:8px;}
  .comment-panel.open{display:block;}
  .comments{padding-left:2px;}
  .comment-bubble{font-size:12px;background:var(--paper2);border-radius:10px;padding:5px 9px;margin-top:4px;display:inline-block;}
  .comment-bubble b{color:var(--teal);}
  .mini-btn{background:none;border:none;color:var(--ink-soft);font-size:11px;padding:0 2px;margin-left:2px;}
  .comment-edit-row{display:flex;gap:6px;margin-top:4px;}
  .comment-edit-row input{flex:1;padding:6px 10px;border-radius:999px;border:1.5px solid var(--teal);font-size:12.5px;outline:none;background:var(--bg);color:var(--ink);}
  .comment-edit-row button{padding:6px 10px;border:none;border-radius:999px;background:var(--teal);color:#15121C;font-size:11.5px;font-weight:700;}
  .comment-edit-row button.ghost{background:none;color:var(--ink-soft);border:1.5px solid var(--line);}
  .comment-form{display:flex;gap:6px;margin-top:6px;}
  .comment-form input{flex:1;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;outline:none;background:var(--bg);color:var(--ink);}
  .comment-form button{padding:8px 14px;border:none;border-radius:999px;background:var(--teal);color:#15121C;font-size:13px;font-weight:700;}

  .journal-box{margin-top:16px;padding-top:12px;border-top:2px solid var(--line);}
  .journal-box h4{margin:0 0 8px;font-size:14px;font-family:'Baloo 2';font-weight:700;color:var(--ink);}
  .journal-form{display:flex;gap:6px;}
  .journal-form textarea{
    flex:1;resize:none;border-radius:14px;border:2px solid var(--line);padding:8px 12px;font-size:13px;
    outline:none;min-height:38px;background:var(--bg);color:var(--ink);
  }
  .journal-form button{padding:0 14px;border:none;border-radius:14px;background:var(--cherry);color:#15121C;font-weight:700;font-size:13px;}
  .sticky-note{
    margin-top:10px;padding:9px 12px;border-radius:4px 14px 14px 4px;font-size:12.5px;color:#1A1420;
    box-shadow:2px 2px 0 rgba(0,0,0,0.3);
  }
  .sticky-note b{font-family:'Baloo 2';}
  .sticky-note.c0{background:var(--mustard);transform:rotate(-1deg);}
  .sticky-note.c1{background:var(--pink);transform:rotate(1deg);}
  .sticky-note.c2{background:var(--teal);transform:rotate(-1deg);}
  .sticky-note textarea{width:100%;border:none;background:rgba(255,255,255,0.4);border-radius:8px;padding:5px 8px;font-size:12.5px;color:#1A1420;resize:none;min-height:34px;outline:none;}
  .sticky-actions{margin-top:5px;display:flex;gap:6px;}
  .sticky-actions button{padding:4px 10px;border:none;border-radius:999px;background:#1A1420;color:#fff;font-size:11px;font-weight:700;}
  .sticky-actions button.ghost{background:rgba(255,255,255,0.5);color:#1A1420;}

  /* region-only place row */
  .place-row{position:relative;padding:9px 0;border-bottom:1px dashed var(--line);}
  .place-row:last-child{border-bottom:none;}
  .place-row::before{content:'';position:absolute;left:-20px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--pink);border:2px solid var(--paper);box-shadow:0 0 0 2px var(--pink);}
  .place-day{font-size:10.5px;color:var(--ink-soft);font-weight:700;}

  /* ---------- Info & checklist & guide ---------- */
  .info-card{background:var(--paper);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:4px 4px 0 var(--shadow);border:2px solid rgba(255,255,255,0.08);}
  .info-card h3{margin:0 0 8px;font-size:15.5px;display:flex;align-items:center;gap:8px;}
  .info-card p{margin:4px 0;font-size:13.5px;line-height:1.6;color:var(--ink-soft);}
  .info-card textarea{
    width:100%;margin-top:8px;border-radius:12px;border:2px dashed var(--line);padding:8px 10px;
    font-size:13px;resize:vertical;min-height:44px;outline:none;background:var(--bg);color:var(--ink);
  }
  .checklist-item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px dashed var(--line);}
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item input{width:19px;height:19px;accent-color:var(--sage);}
  .checklist-item span{font-size:14.5px;font-weight:600;flex:1;word-break:break-word;}
  .checklist-item.checked span{text-decoration:line-through;color:var(--ink-soft);}
  .checklist-item .cw{font-size:11px;color:var(--ink-soft);white-space:nowrap;}
  .checklist-item .del{background:none;border:none;color:var(--ink-soft);font-size:16px;padding:2px 6px;}
  .add-row{display:flex;gap:6px;margin-top:12px;}
  .add-row input{flex:1;padding:9px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;outline:none;background:var(--bg);color:var(--ink);}
  .add-row button{padding:9px 16px;border:none;border-radius:999px;background:var(--teal);color:#15121C;font-weight:700;font-size:13px;}
  .section-title{font-family:'Baloo 2';font-weight:700;font-size:19px;margin:6px 0 12px;color:var(--ink);}
  .guide-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);}
  .guide-item:last-child{border-bottom:none;}
  .guide-item .gi{font-size:22px;min-width:30px;}
  .guide-item h4{margin:0 0 3px;font-size:14.5px;font-family:'Baloo 2';}
  .guide-item p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.5;}

  /* members */
  .member-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px dashed var(--line);}
  .member-row:last-child{border-bottom:none;}
  .member-avatar{width:38px;height:38px;border-radius:50%;background:var(--teal-tint);color:var(--teal);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Baloo 2';font-size:15px;flex-shrink:0;}
  .member-name{font-weight:700;font-size:14.5px;flex:1;word-break:break-word;}
  .member-meta{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
  .member-count-banner{font-size:13px;color:var(--ink-soft);margin-bottom:10px;}

  /* region illustrations */
  .stamp svg{width:34px;height:34px;}

  /* photo wall */
  .photo-box{margin-top:16px;padding-top:12px;border-top:2px solid var(--line);}
  .photo-box h4{margin:0 0 8px;font-size:14px;font-family:'Baloo 2';font-weight:700;color:var(--ink);}
  .photo-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch;}
  .photo-thumb{position:relative;flex:0 0 auto;width:72px;height:72px;border-radius:12px;overflow:hidden;border:2px solid var(--paper2);background:var(--paper2);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb .pdel{position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;padding:0;}
  .photo-thumb .pby{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.5);color:#fff;font-size:9px;padding:1px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .photo-add-btn{flex:0 0 auto;width:72px;height:72px;border-radius:12px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--ink-soft);background:none;}

  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.88);display:none;align-items:center;justify-content:center;z-index:100;padding:24px;}
  #lightbox.open{display:flex;}
  #lightbox img{max-width:100%;max-height:78vh;border-radius:12px;display:block;}
  #lightbox .lb-caption{color:#fff;text-align:center;font-size:13px;margin-top:8px;}
  #lightbox .lb-close{position:fixed;top:18px;right:18px;background:none;border:none;color:#fff;font-size:26px;padding:6px 10px;}

  /* expense / settlement */
  .exp-form-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .exp-form-row input[type=text], .exp-form-row input[type=number]{
    flex:1;min-width:110px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);
    font-size:14px;outline:none;background:var(--bg);color:var(--ink);
  }
  .exp-form-row select{
    padding:9px 10px;border-radius:12px;border:1.5px solid var(--line);font-size:14px;
    background:var(--bg);color:var(--ink);outline:none;
  }
  .exp-participants{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;}
  .exp-chip{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink-soft);}
  .exp-chip.on{border-color:var(--teal);color:var(--teal);background:var(--teal-tint);}
  .exp-submit-row{display:flex;gap:8px;align-items:center;}
  .exp-submit-row button{padding:9px 18px;border:none;border-radius:999px;background:var(--cherry);color:#15121C;font-weight:700;font-size:14px;}
  .exp-submit-row .cancel-edit{background:none;border:1.5px solid var(--line);color:var(--ink-soft);}
  .expense-row{background:var(--paper);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:3px 3px 0 var(--shadow);border:2px solid rgba(255,255,255,0.08);}
  .expense-row .etop{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .expense-row .etitle{font-weight:700;font-size:14.5px;}
  .expense-row .eamt{font-weight:800;font-family:'Baloo 2';color:var(--mustard);font-size:15px;white-space:nowrap;}
  .expense-row .emeta{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .expense-row .eactions{margin-top:6px;display:flex;gap:8px;}
  .expense-row .eactions button{background:none;border:none;color:var(--ink-soft);font-size:12px;padding:0;}
  .settle-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .settle-row:last-child{border-bottom:none;}
  .settle-row b{font-weight:700;}
  .settle-pos{color:var(--sage);}
  .settle-neg{color:var(--cherry);}
  .settle-tx{font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line);}
  .settle-tx:last-child{border-bottom:none;}
  .settle-empty{font-size:13px;color:var(--ink-soft);}
</style>
</head>
<body>
<div class="app">

  <!-- LANDING -->
  <div id="landing">
    <svg class="route-doodle" viewBox="0 0 340 60"><path d="M10,45 Q90,5 170,35 T330,20"/></svg>
    <div class="landing-emoji-row">✈️🌴🎰🏜️</div>
    <h1>一男大戰六女<br>美國行 🇺🇸</h1>
    <p class="sub">洛杉磯・拉斯維加斯・大峽谷・鳳凰城公路旅行</p>
    <div class="tag-card">
      <label>先寫下你的入團名稱 ✏️</label>
      <input id="nickInput" type="text" placeholder="例如：陳晴" maxlength="12">
      <button class="go-btn" id="goBtn" disabled>出發吧 🚗💨</button>
      <div class="landing-note">輸入一次就好，之後這台裝置會記得你</div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="mainApp" style="display:none;">
    <div id="topbar">
      <div class="row1">
        <h2>一男大戰六女 美國行 🇺🇸</h2>
        <span class="hi-chip" id="hiChip">Hi!</span>
      </div>

/* ===================== STORAGE ===================== */
async function sGet(key, shared){
  try{ const r = await window.storage.get(key, !!shared); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function sSet(key, value, shared){
  try{ await window.storage.set(key, JSON.stringify(value), !!shared); return true; }
  catch(e){ return false; }
}

function itemId(dayId, idx){ return dayId + '-i' + idx; }
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ===================== RENDER ===================== */
function fmtCountdown(){
  const now = new Date();
  if(now < TRIP_START){
    const days = Math.ceil((TRIP_START - now)/86400000);
    return '距離出發還有 ' + days + ' 天';
  } else if(now <= TRIP_END){
    const day = Math.floor((now - TRIP_START)/86400000) + 1;
    return '旅行中 · Day ' + day;
  }
  return '旅程已結束 🎉';
}

function checkableItems(){
  const list = [];
  DAYS.forEach(d=>d.items.forEach((it,idx)=>{ if(it.links && it.links.length) list.push(itemId(d.id, idx)); }));
  return list;
}
function doneItemsCount(ids){
  let c=0;
  ids.forEach(id=>{ const rec = CHECKINS[id]; if(rec && rec.checkedBy && rec.checkedBy.length>0) c++; });
  return c;
}

function renderTopbar(){
  document.getElementById('hiChip').textContent = 'Hi, ' + NICK + ' 👋';
  document.getElementById('countdownChip').textContent = fmtCountdown();
  const ids = checkableItems();
  const total = ids.length, done = doneItemsCount(ids);
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = '全團行程完成度 ' + pct + '%（' + done + '/' + total + '）';
}

function badgeHtml(badges){
  if(!badges) return '';
  return badges.map(b=> b==='res' ? '<span class="badge res">✅ 已訂位</span>' : '<span class="badge fav">💘 最愛</span>').join(' ');
}
function linksHtml(links){
  if(!links || !links.length) return '';
  return '<div class="map-links">' + links.map(lk=>'<a class="map-link" target="_blank" rel="noopener" href="'+lk.u+'">📍 '+esc(lk.l)+'</a>').join('') + '</div>';
}
function noteHtml(note){
  if(!note) return '';
  const arr = Array.isArray(note) ? note : [note];
  return arr.map(n=>'<div class="item-note">📝 備註：'+esc(n)+'</div>').join('');
}
function renderComments(list, id){
  if(!list || !list.length) return '';
  return '<div class="comments">' + list.map(c=>{
    if(editingComments.has(c.id)){
      return `<div class="comment-edit-row">
        <input type="text" value="${esc(c.text)}" data-edit-comment-input="${c.id}" maxlength="60">
        <button data-save-comment="${id}" data-comment-id="${c.id}">儲存</button>
        <button data-cancel-comment="${c.id}" class="ghost">取消</button>
      </div>`;
    }
    const mine = c.by === NICK;
    return '<div class="comment-bubble"><b>'+esc(c.by)+'：</b>'+esc(c.text)
      + (mine ? ' <button class="mini-btn" data-edit-comment="'+c.id+'">✏️</button><button class="mini-btn" data-del-comment="'+id+'" data-comment-id="'+c.id+'">🗑</button>' : '')
      + '</div>';
  }).join('') + '</div>';
}

function renderDayList(){
  const wrap = document.getElementById('dayList');
  wrap.innerHTML = DAYS.map(d=>{
    const linkedIdx = d.items.map((it,idx)=>it.links&&it.links.length?idx:-1).filter(i=>i>=0);
    let done = 0;
    linkedIdx.forEach(idx=>{ const r=CHECKINS[itemId(d.id,idx)]; if(r&&r.checkedBy&&r.checkedBy.length) done++; });
    const total = linkedIdx.length;

    const itemsHtml = d.items.map((it,idx)=>{
      const id = itemId(d.id, idx);
      const hasLinks = it.links && it.links.length;
      const rec = CHECKINS[id] || {checkedBy:[], comments:[]};
      const isChecked = rec.checkedBy && rec.checkedBy.includes(NICK);
      const commentCount = (rec.comments||[]).length;
      const isCommentOpen = openComments.has(id);
      let actionHtml = '';
      if(hasLinks){
        const pipsHtml = MEMBERS.map(m=>{
          const checked = rec.checkedBy && rec.checkedBy.includes(m.name);
          const isSelf = m.name === NICK;
          const initial = m.name ? m.name[0] : '?';
          const mark = checked ? '✓' : initial;
          if(isSelf){
            return `<label class="pip self ${checked?'checked':''}" title="${esc(m.name)}">
              <input type="checkbox" data-day="${d.id}" data-idx="${idx}" ${checked?'checked':''}/>
              <span class="mark">${esc(mark)}</span>
            </label>`;
          }
          return `<span class="pip ${checked?'checked':''}" title="${esc(m.name)}">${esc(mark)}</span>`;
        }).join('');
        actionHtml = `

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read fail'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('img fail'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- Money / Settlement ---------- */
function ntdOf(exp){
  return exp.currency==='USD' ? Math.round(exp.amount * (exp.rate||1)) : Math.round(exp.amount);
}

function computeSettlement(){
  const net = {};
  MEMBERS.forEach(m=>{ net[m.name] = 0; });
  EXPENSES.forEach(exp=>{
    const total = ntdOf(exp);
    const parts = exp.participants && exp.participants.length ? exp.participants : MEMBERS.map(m=>m.name);
    const share = total / parts.length;
    if(net[exp.payer] === undefined) net[exp.payer] = 0;
    net[exp.payer] += total;
    parts.forEach(p=>{
      if(net[p] === undefined) net[p] = 0;
      net[p] -= share;
    });
  });
  return net;
}

function simplifyDebts(net){
  const eps = 1;
  let creditors = Object.entries(net).filter(([n,v])=>v>eps).map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v);
  let debtors = Object.entries(net).filter(([n,v])=>v<-eps).map(([n,v])=>({n,v:-v})).sort((a,b)=>b.v-a.v);
  const txs = [];
  let i=0, j=0;
  while(i<debtors.length && j<creditors.length){
    const pay = Math.min(debtors[i].v, creditors[j].v);
    if(pay > eps) txs.push({from:debtors[i].n, to:creditors[j].n, amount:Math.round(pay)});
    debtors[i].v -= pay; creditors[j].v -= pay;
    if(debtors[i].v <= eps) i++;
    if(creditors[j].v <= eps) j++;
  }
  return txs;
}

  const net = computeSettlement();
  const txs = simplifyDebts(net);
  const settleWrap = document.getElementById('settlementCard');

  wrap.innerHTML = `
    <div class="exp-form-row">
      <input type="text" id="expDesc" placeholder="項目（例如：租車油錢）" value="${editing?esc(editing.desc):''}">
    </div>
    <div class="exp-form-row">
      <input type="number" id="expAmount" placeholder="金額" value="${editing?editing.amount:''}" min="0" step="0.01">
      <select id="expCurrency">
        <option value="USD" ${currency==='USD'?'selected':''}>USD 美金</option>
        <option value="NTD" ${currency==='NTD'?'selected':''}>NTD 台幣</option>
      </select>
    </div>
    <div class="exp-form-row" id="expRateRow" style="${currency==='USD'?'':'display:none;'}">
      <input type="number" id="expRate" placeholder="匯率（1 USD = ? NTD）" value="${editing&&editing.rate?editing.rate:''}" min="0" step="0.01">
    </div>
    <div class="exp-form-row">
      <select id="expPayer">${payerOptions}</select>
      <input type="text" id="expNote" placeholder="備註（可留空）" value="${editing&&editing.note?esc(editing.note):''}">
    </div>
    <div class="exp-participants">${memberChips}</div>
    <div class="exp-submit-row">
      <button id="expSubmitBtn">${editing?'儲存':'新增'}</button>
      ${editing? '<button type="button" class="cancel-edit" id="expCancelBtn">取消編輯</button>' : ''}
    </div>
  `;

  document.getElementById('expCurrency').addEventListener('change', (e)=>{
    document.getElementById('expRateRow').style.display = e.target.value==='USD' ? '' : 'none';
  });
  document.querySelectorAll('[data-exp-chip]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const n = chip.dataset.expChip;
      if(expenseParticipants.has(n)) expenseParticipants.delete(n); else expenseParticipants.add(n);
      chip.classList.toggle('on');
    });
  });
  document.getElementById('expSubmitBtn').addEventListener('click', submitExpense);
  const cancelBtn = document.getElementById('expCancelBtn');
  if(cancelBtn){
    cancelBtn.addEventListener('click', ()=>{
      editingExpenseId = null;
      expenseParticipants = new Set(MEMBERS.map(m=>m.name));
      renderMoney();
    });
  }
}

async function submitExpense(){
  const desc = document.getElementById('expDesc').value.trim();
  const amount = parseFloat(document.getElementById('expAmount').value);
  const currency = document.getElementById('expCurrency').value;
  const rate = currency==='USD' ? parseFloat(document.getElementById('expRate').value) : null;
  const payer = document.getElementById('expPayer').value;
  const note = document.getElementById('expNote').value.trim();
  const participants = Array.from(expenseParticipants);

  if(!desc || !amount || amount<=0){ alert('請填寫項目跟金額'); return; }
  if(currency==='USD' && (!rate || rate<=0)){ alert('美金記得要填匯率喔'); return; }
  if(!participants.length){ alert('至少要有一個人分攤'); return; }

  if(editingExpenseId){
    const exp = EXPENSES.find(x=>x.id===editingExpenseId);
    Object.assign(exp, {desc, amount, currency, rate, payer, note, participants});
  } else {
    EXPENSES.push({id:genId(), desc, amount, currency, rate, payer, note, participants, by:NICK, ts:Date.now()});
  }
  await sSet('expenses', EXPENSES, true);
  editingExpenseId = null;
  expenseParticipants = new Set(MEMBERS.map(m=>m.name));
  renderMoney();
}

function attachMoneyListeners(){
  document.querySelectorAll('[data-edit-expense]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editingExpenseId = btn.dataset.editExpense;
      renderMoney();
      document.getElementById('expDesc').scrollIntoView({behavior:'smooth', block:'center'});
    });
  });
  document.querySelectorAll('[data-del-expense]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      EXPENSES = EXPENSES.filter(x=>x.id!==btn.dataset.delExpense);
      await sSet('expenses', EXPENSES, true);
      if(editingExpenseId===btn.dataset.delExpense) editingExpenseId=null;
      renderMoney();
    });
  });
}

/* ---------- Tabs ---------- */
function initTabs(){
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.view).classList.add('active');
      window.scrollTo(0,0);
    });
  });
}

function initLightbox(){
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lightbox').addEventListener('click', (e)=>{
    if(e.target.id === 'lightbox') closeLightbox();
  });
}

/* ---------- Boot ---------- */
async function boot(){
  NICK = await sGet('nickname', false);
  if(NICK){
    await enterApp();
  } else {
    document.getElementById('nickInput').addEventListener('input', e=>{
      document.getElementById('goBtn').disabled = !e.target.value.trim();
    });
    document.getElementById('goBtn').addEventListener('click', async ()=>{
      const v = document.getElementById('nickInput').value.trim();
      if(!v) return;
      NICK = v;
      await sSet('nickname', v, false);
      await enterApp();
    });
    document.getElementById('nickInput').addEventListener('keydown', e=>{
      if(e.key==='Enter' && e.target.value.trim()) document.getElementById('goBtn').click();
    });
  }
}

async function enterApp(){
  document.getElementById('landing').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('tabbar').style.display = 'flex';
  document.getElementById('view-guide').classList.add('active');

  CHECKINS = (await sGet('checkins', true)) || {};
  JOURNAL = (await sGet('journal', true)) || {};
  PRETRIP = (await sGet('pretrip', true)) || {};
  INFO_NOTES = (await sGet('info_notes', true)) || {};
  PERSONAL = (await sGet('personal_extra', false)) || [];
  MEMBERS = (await sGet('members', true)) || [];
  PHOTOS = (await sGet('photos', true)) || {};
  EXPENSES = (await sGet('expenses', true)) || [];

  if(!MEMBERS.find(m=>m.name===NICK)){
    MEMBERS.push({name:NICK, ts:Date.now()});
    await sSet('members', MEMBERS, true);
  }

  let idsFixed = false;
  Object.values(CHECKINS).forEach(rec=>{
    (rec.comments||[]).forEach(c=>{ if(!c.id){ c.id = genId(); idsFixed = true; } });
  });
  Object.values(JOURNAL).forEach(list=>{
    list.forEach(j=>{ if(!j.id){ j.id = genId(); idsFixed = true; } });
  });
  if(idsFixed){
    await sSet('checkins', CHECKINS, true);
    await sSet('journal', JOURNAL, true);
  }

  renderTopbar();
  renderDayList();
  renderRegions();
  renderInfo();
  renderChecklist();
  renderPersonal();
  renderGuide();
  renderMembers();
  initTabs();
  initLightbox();

  expenseParticipants = new Set(MEMBERS.map(m=>m.name));
  renderMoney();

  document.getElementById('personalAddBtn').addEventListener('click', addPersonalItem);
  document.getElementById('personalInput').addEventListener('keydown', e=>{
    if(e.key==='Enter') addPersonalItem();
  });

  setInterval(renderTopbar, 60000);
}

async function addPersonalItem(){
  const input = document.getElementById('personalInput');
  const text = input.value.trim();
  if(!text) return;
  PERSONAL.push({text, checked:false});
  await sSet('personal_extra', PERSONAL, false);
  input.value = '';
  renderPersonal();
}

boot();
</script>
</body>
</html>
